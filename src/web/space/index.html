<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>procinsh</title><link rel="stylesheet" href="/space/style.css"><script type="module" src="/space/app.js"></script></head>
<body><canvas id="world" aria-label="3D communication, file I/O and memory space for all processes"></canvas><canvas id="labels" class="process-labels" aria-hidden="true"></canvas><div class="vignette"></div>
<header><div class="brand"><a href="/list" id="brand">procinsh v{{PROCINSH_VERSION}}</a>{{PROCINSH_BUILD_REVISION}}</div><a href="/list" id="back" class="view-link">Go to list view</a><div class="view-help">DRAG · ORBIT　 RIGHT DRAG · PAN　 SCROLL · ZOOM <span id="fps"></span></div><a href="https://github.com/akawashiro/procinsh" class="github-link" target="_blank" rel="noopener noreferrer">GitHub</a></header>
<div class="left-hud"><nav class="tools"><input id="search" type="search" placeholder="Find PID / process…" aria-label="Find process"><button id="reset">Fit all</button><button id="rearrange">Rearrange</button></nav></div>
<aside id="details" hidden><button id="close" aria-label="Clear selection">×</button><div id="process-details"><div class="eyebrow">SELECTED PROCESS</div><h2 id="name"></h2><p id="pid"></p><a id="inspect">Open process details ↗</a></div><div id="connection-details" hidden><div class="eyebrow" id="connection-kind">SELECTED CONNECTION</div><h2 id="connection-label"></h2><p id="connection-state"></p><div id="connection-facts"></div><div id="connection-endpoints"></div></div></aside>
<div id="hover" hidden></div><div id="failure" role="alert" hidden></div>
</body></html>
