<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>procinsh</title>
  <link rel="stylesheet" href="/shared/style.css"><link rel="stylesheet" href="/list/style.css"><script type="module" src="/list/app.js"></script>
</head>
<body>
  <header><div class="brand"><a href="/list" id="brand">procinsh v{{PROCINSH_VERSION}}</a>{{PROCINSH_BUILD_REVISION}}</div><a href="/space" class="view-link">Go to space view</a><a href="https://github.com/akawashiro/procinsh" class="github-link" target="_blank" rel="noopener noreferrer">GitHub</a></header>
  <main>
    <div id="error" role="alert" hidden></div>
    <section id="explorer">
      <div class="toolbar"><input type="search" id="search" placeholder="Search name, PID, or command…" aria-label="Search processes"><label>Sort <select id="sort"><option value="cpu">CPU ↓</option><option value="rss">RSS ↓</option><option value="pid">PID ↑</option></select></label><span id="process-count" class="muted"></span></div>
      <div class="panel scroll"><table><thead><tr><th>PID</th><th>USER</th><th>CPU</th><th>RSS</th><th>THREADS</th><th>STATE</th><th>NAME / COMMAND</th></tr></thead><tbody id="process-list"></tbody></table></div>
    </section>
  </main>
</body>
</html>
