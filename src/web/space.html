<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>procinsh / SPACE</title><link rel="stylesheet" href="/space.css"><script type="module" src="/space.js"></script></head>
<body><canvas id="world" aria-label="3D communication, file I/O and memory space for all processes"></canvas><canvas id="labels" class="process-labels" aria-hidden="true"></canvas><div class="vignette"></div>
<header><a href="/" id="brand">procinsh</a><a href="/" id="back">Back to top</a><div class="legend"><i class="code"></i>CODE <i class="heap"></i>HEAP <i class="stack"></i>STACK <i class="data"></i>DATA <span>│</span> <i class="cpu"></i>CPU <i class="read"></i>READ <i class="write"></i>WRITE <i class="network"></i>NETWORK <i class="file"></i>FILE</div><div class="view-help">DRAG · ORBIT　 RIGHT DRAG · PAN　 SCROLL · ZOOM <span id="fps"></span></div></header>
<div class="left-hud"><nav class="tools"><input id="search" type="search" placeholder="Find PID / process…" aria-label="Find process"><select id="density" aria-label="Sampling density"><option value="1">LOW</option><option value="2" selected>STANDARD</option><option value="3">HIGH</option></select><button id="reset">Fit all</button><button id="rearrange">Rearrange</button></nav></div>
<aside id="details" hidden><button id="close" aria-label="Clear selection">×</button><div id="process-details"><div class="eyebrow">SELECTED PROCESS</div><h2 id="name"></h2><p id="pid"></p><div id="facts"></div><p id="memory-status" role="status"></p><a id="inspect">Open process details ↗</a></div><div id="connection-details" hidden><div class="eyebrow" id="connection-kind">SELECTED CONNECTION</div><h2 id="connection-label"></h2><p id="connection-state"></p><div id="connection-facts"></div><div id="connection-endpoints"></div></div></aside>
<div id="hover" hidden></div><div id="failure" role="alert" hidden></div>
</body></html>
