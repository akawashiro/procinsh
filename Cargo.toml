[package]
name = "procinsh"
version = "0.1.20"
edition = "2024"
default-run = "procinsh"
description = "Explore Linux processes in 3D. A real-time process inspector powered by Rust, eBPF and Three.js."
license = "MIT"
repository = "https://github.com/akawashiro/procinsh"
readme = "README.md"
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
    "/build.rs",
    "/build/**",
    "/rust-toolchain.toml",
    "/src/**",
    "/web/dist/**",
]

[[bin]]
name = "procinsh"
path = "src/http_server/entry.rs"

[[bin]]
name = "procinsh-privileged-helper"
path = "src/privileged_helper/entry.rs"

[dependencies]
log = "0.4"
env_logger = "0.11"
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
object = { version = "0.36", features = ["read"] }
addr2line = { version = "0.24", default-features = false, features = ["std", "rustc-demangle", "cpp_demangle"] }
gimli = { version = "0.31", default-features = false, features = ["read", "std", "endian-reader"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util"] }
async-stream = "0.3"
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "intel"] }
libbpf-rs = "0.26.2"
tower-http = { version = "0.7", features = ["compression-gzip"] }
framehop = { version = "0.16.0", default-features = false, features = ["std"] }
rust-embed = { version = "8.13.0", features = ["debug-embed"] }
mime_guess = "2.0.5"
flate2 = "1"
toml = "1.1.8"
logblur-core = { version = "0.2.2", default-features = false }
sha2 = "0.11"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = "debuginfo"

[build-dependencies]
libbpf-cargo = "0.26.2"
