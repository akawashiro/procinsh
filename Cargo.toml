[package]
name = "procinsh"
version = "0.1.0"
edition = "2024"
description = "A local, read-only Linux x86-64 process inspector"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
object = { version = "0.36", features = ["read"] }
addr2line = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
async-stream = "0.3"
humantime = "2"
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "intel"] }
libbpf-rs = "0.26.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = "debuginfo"

[build-dependencies]
libbpf-cargo = "0.26.2"
