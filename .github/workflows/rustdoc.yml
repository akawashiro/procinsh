name: Publish documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        # rustup reads the version and components from rust-toolchain.toml.
        run: rustup show active-toolchain
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install web dependencies
        run: npm ci
      - name: Build web assets
        run: npm run build:web
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential clang llvm pkg-config libelf-dev zlib1g-dev python3 \
            linux-tools-common linux-tools-generic graphviz
      - name: Configure bpftool and check kernel BTF
        shell: bash
        run: |
          # Use the packaged binary directly: the wrapper requires tools matching
          # the runner's kernel, which may differ from the installed generic kernel.
          shopt -s nullglob
          bpftools=(/usr/lib/linux-tools/*/bpftool)
          if (( ${#bpftools[@]} == 0 )); then
            echo "::error::No packaged bpftool binary found"
            exit 1
          fi
          echo "BPFTOOL=${bpftools[0]}" >> "$GITHUB_ENV"
          test -r /sys/kernel/btf/vmlinux
          "${bpftools[0]}" version

      - name: Install dependency graph tool
        run: cargo install cargo-modules --version 0.27.0 --locked

      - name: Install documentation nightly
        run: rustup toolchain install nightly-2026-09-28 --profile minimal

      - name: Build internal API documentation
        run: |
          cargo fmt --manifest-path tools/internal-api-docs/Cargo.toml --check
          cargo test --locked --manifest-path tools/internal-api-docs/Cargo.toml
          cargo clippy --locked --manifest-path tools/internal-api-docs/Cargo.toml --all-targets -- -D warnings
          # Keep build artifacts and JSON outside the published site.
          cargo +nightly-2026-09-28 rustdoc --locked --bin procinsh \
            --target-dir target/internal-api-json -- \
            --document-private-items --document-hidden-items -Z unstable-options --output-format json
          cargo run --locked --manifest-path tools/internal-api-docs/Cargo.toml -- \
            target/internal-api-json/doc/procinsh.json target/pages/internal-api

      - name: Build module dependency graphs
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          mkdir -p target/pages/architecture
          # The item filters fold references into the containing modules.
          # Keep uses edges; --no-uses would produce only an ownership tree.
          cargo modules dependencies --bin procinsh --no-externs --no-sysroot \
            --no-fns --no-traits --no-types > target/pages/architecture/modules-raw.dot
          python3 scripts/module_dependencies.py target/pages/architecture/modules-raw.dot \
            --output target/pages/architecture

      - name: Create index page
        run: |
          echo '<!doctype html><html lang="ja">' \
            '<meta charset="utf-8">' \
            '<meta name="viewport" content="width=device-width,initial-scale=1">' \
            '<title>ProcInSh Documentation</title>' \
            '<h1>ProcInSh Documentation</h1><ul>' \
            > target/pages/index.html

          echo '<li><a href="architecture/">Module dependency graph</a></li>' >> target/pages/index.html
          echo '<li><a href="internal-api/">Internal API</a></li>' >> target/pages/index.html
          echo '</ul></html>' >> target/pages/index.html
          touch target/pages/.nojekyll

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: target/pages

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
