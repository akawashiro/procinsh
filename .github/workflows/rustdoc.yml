name: Publish rustdoc

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        # rustup reads the version and components from rust-toolchain.toml.
        run: rustup show active-toolchain
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install web dependencies
        run: npm ci
      - name: Build web assets
        run: npm run build:web
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential clang llvm pkg-config libelf-dev zlib1g-dev python3 \
            linux-tools-common linux-tools-generic graphviz
      - name: Configure bpftool and check kernel BTF
        shell: bash
        run: |
          # Use the packaged binary directly: the wrapper requires tools matching
          # the runner's kernel, which may differ from the installed generic kernel.
          shopt -s nullglob
          bpftools=(/usr/lib/linux-tools/*/bpftool)
          if (( ${#bpftools[@]} == 0 )); then
            echo "::error::No packaged bpftool binary found"
            exit 1
          fi
          echo "BPFTOOL=${bpftools[0]}" >> "$GITHUB_ENV"
          test -r /sys/kernel/btf/vmlinux
          "${bpftools[0]}" version

      - name: Install dependency graph tool
        run: cargo install cargo-modules --version 0.27.0 --locked

      - name: Build rustdoc
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links"
        run: cargo doc --locked --workspace --no-deps --document-private-items

      - name: Build module dependency graphs
        run: |
          mkdir -p target/doc/architecture
          # The item filters fold references into the containing modules.
          # Keep uses edges; --no-uses would produce only an ownership tree.
          cargo modules dependencies --bin procinsh --no-externs --no-sysroot \
            --no-fns --no-traits --no-types > target/doc/architecture/modules-raw.dot
          python3 scripts/module_dependencies.py target/doc/architecture/modules-raw.dot

      - name: Create index page
        run: |
          echo '<!doctype html><html lang="ja">' \
            '<meta charset="utf-8">' \
            '<meta name="viewport" content="width=device-width,initial-scale=1">' \
            '<title>Rust API Docs</title>' \
            '<h1>Rust API Docs</h1><ul>' \
            > target/doc/index.html

          for file in target/doc/*/index.html; do
            [ -f "$file" ] || continue
            [ "$file" != target/doc/architecture/index.html ] || continue
            crate=$(basename "$(dirname "$file")")
            echo "<li><a href=\"$crate/index.html\">$crate</a></li>" \
              >> target/doc/index.html
          done

          echo '<li><a href="architecture/">Module dependency graph</a></li>' >> target/doc/index.html
          echo '</ul></html>' >> target/doc/index.html
          touch target/doc/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: target/doc

  deploy:
    needs: build
    runs-on: ubuntu-24.04

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
