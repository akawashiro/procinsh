name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        # rustup reads the version and components from rust-toolchain.toml.
        run: rustup show active-toolchain
      - name: Check Rust formatting
        run: |
          cargo fmt --all --check
          rustfmt --edition 2024 --check src/ebpf/src/*.rs src/ebpf/src/bin/*.rs
      - name: Install pinned clang-format
        run: |
          python3 -m venv "$RUNNER_TEMP/clang-format"
          "$RUNNER_TEMP/clang-format/bin/python" -m pip install -r requirements-format.txt
          echo "$RUNNER_TEMP/clang-format/bin" >> "$GITHUB_PATH"
      - name: Check C formatting
        run: python3 scripts/format_c.py --check

  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        # rustup reads the version and components from rust-toolchain.toml.
        run: rustup show active-toolchain
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install web dependencies
        run: npm ci
      - name: Check TypeScript
        run: npm run typecheck
      - name: Build web assets
        run: npm run build:web
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential python3 gh zstd
      - name: Install pinned BPF tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/setup_bpf.sh "$RUNNER_TEMP/bpf-tools"
          echo "$RUNNER_TEMP/bpf-tools" >> "$GITHUB_PATH"
          test -r /sys/kernel/btf/vmlinux
      - name: Build
        run: cargo build --locked --all-targets
      - name: Check rustdoc
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links"
        run: cargo doc --locked --workspace --no-deps --document-private-items
      - name: Check Clippy
        run: PROCINSH_BPF_CLIPPY=1 cargo clippy --all-targets --locked -- -D warnings
      - name: Check listen policy
        run: python3 tests/listen-policy.py
      - name: Check space model
        run: node tests/space-model.mjs

  distro-build:
    name: Build and test (${{ matrix.distro }})
    # Containers vary userspace only. Keep runner/kernel checks in the build job.
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.image }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Ubuntu 24.04
            image: ubuntu:24.04
            family: ubuntu
          - distro: Ubuntu 26.04
            image: ubuntu:26.04
            family: ubuntu
          - distro: Fedora 44
            image: fedora:44
            family: fedora
    steps:
      - name: Install Ubuntu native dependencies
        if: matrix.family == 'ubuntu'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            ca-certificates curl git tar gzip build-essential python3 gh zstd
      - name: Install Fedora native dependencies
        if: matrix.family == 'fedora'
        run: |
          dnf install --assumeyes \
            ca-certificates curl git tar gzip gcc gcc-c++ make python3 gh zstd
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js and npm
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install web dependencies
        run: npm ci
      - name: Build web assets
        run: npm run build:web
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            https://sh.rustup.rs -o "$RUNNER_TEMP/rustup-init.sh"
          sh "$RUNNER_TEMP/rustup-init.sh" -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" show active-toolchain
      - name: Install pinned BPF tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/setup_bpf.sh "$RUNNER_TEMP/bpf-tools"
          echo "$RUNNER_TEMP/bpf-tools" >> "$GITHUB_PATH"
          test -r /sys/kernel/btf/vmlinux
      - name: Build
        run: cargo build --locked --all-targets
      - name: Run Rust tests
        run: cargo test --locked
