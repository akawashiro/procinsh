name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        # rustup reads the version and components from rust-toolchain.toml.
        run: rustup show active-toolchain
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Install pinned clang-format
        run: |
          python3 -m venv "$RUNNER_TEMP/clang-format"
          "$RUNNER_TEMP/clang-format/bin/python" -m pip install -r requirements-format.txt
          echo "$RUNNER_TEMP/clang-format/bin" >> "$GITHUB_PATH"
      - name: Check C formatting
        run: python3 scripts/format_c.py --check

  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        # rustup reads the version and components from rust-toolchain.toml.
        run: rustup show active-toolchain
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install web dependencies
        run: npm ci
      - name: Check TypeScript
        run: npm run typecheck
      - name: Build web assets
        run: npm run build:web
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential clang llvm pkg-config libelf-dev zlib1g-dev python3 \
            autoconf automake autopoint flex bison gawk \
            linux-tools-common linux-tools-generic
      - name: Configure bpftool and check kernel BTF
        shell: bash
        run: |
          # Use the packaged binary directly: the wrapper requires tools matching
          # the runner's kernel, which may differ from the installed generic kernel.
          shopt -s nullglob
          bpftools=(/usr/lib/linux-tools/*/bpftool)
          if (( ${#bpftools[@]} == 0 )); then
            echo "::error::No packaged bpftool binary found"
            exit 1
          fi
          echo "BPFTOOL=${bpftools[0]}" >> "$GITHUB_ENV"
          test -r /sys/kernel/btf/vmlinux
          "${bpftools[0]}" version
      - name: Build
        run: cargo build --locked --all-targets
      - name: Check Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Run Rust tests
        run: cargo test --locked
      - name: Check traffic measurement clients
        run: python3 -m unittest discover -s scripts -p 'test_measure*.py'
      - name: Check logging
        run: python3 tests/logging-checks.py
      - name: Check space model
        run: node tests/space-model.mjs
      - name: Build static GNU release and check linkage
        env:
          RUSTFLAGS: '-C target-feature=+crt-static'
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-gnu
          binary=target/x86_64-unknown-linux-gnu/release/procinsh
          if readelf -l "$binary" | grep -q INTERP; then
            echo "::error::Static binary has a dynamic interpreter"
            exit 1
          fi
          if readelf -d "$binary" | grep -q '(NEEDED)'; then
            echo "::error::Static binary has shared-library dependencies"
            exit 1
          fi
