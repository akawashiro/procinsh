name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  development-toc:
    name: DEVELOPMENT.md table of contents
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check table of contents
        run: |
          npx --yes doctoc DEVELOPMENT.md
          git diff --exit-code -- DEVELOPMENT.md

  checks:
    name: Format, lint, documentation and packaging (x86-64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Run checks in Docker
        run: bash scripts/docker_test.sh checks

  distro-test:
    name: Build and test (x86-64, ${{ matrix.distro }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu:24.04, ubuntu:26.04, fedora:44]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Run all Rust and frontend tests in capable distro container
        run: bash scripts/docker_test.sh --distro '${{ matrix.distro }}' ordinary

  kernel-test:
    name: Live eBPF tests (x86-64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Run tests with explicit kernel capabilities
        # The entry point specifies BPF, PERFMON, SYS_PTRACE, DAC_READ_SEARCH
        # and SYS_ADMIN, host PIDs for BPF identity, and a read-only BTF mount.
        # Docker's default seccomp and AppArmor profiles remain enabled.
        run: bash scripts/docker_test.sh kernel

  arm64-test:
    name: Checks and ordinary tests (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Run checks in Docker
        run: bash scripts/docker_test.sh checks
      - name: Run all Rust and frontend tests in Docker
        run: bash scripts/docker_test.sh ordinary

  arm64-kernel-test:
    name: Live eBPF tests (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Run tests with explicit kernel capabilities
        run: bash scripts/docker_test.sh kernel

  browser-test:
    name: Chromium browser tests (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86-64
            suite: browser
          - runner: ubuntu-24.04-arm
            arch: arm64
            suite: browser
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Run Chromium tests in Docker
        run: bash scripts/docker_test.sh '${{ matrix.suite }}'
