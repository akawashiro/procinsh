name: Publish documentation and replay demo

on:
  workflow_run:
    workflows: [Build documentation]
    types: [completed]
  pull_request_target:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      pull-requests: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Never check out a PR or execute downloaded artifacts in this job.
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: Prepare all documentation versions
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_docs.py prepare --workspace "$RUNNER_TEMP/documentation"
      - uses: actions/configure-pages@v5
        if: steps.prepare.outputs.ready == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.prepare.outputs.ready == 'true'
        with:
          path: ${{ runner.temp }}/documentation/snapshot/site
      - uses: actions/deploy-pages@v4
        id: deployment
        if: steps.prepare.outputs.ready == 'true'
      - name: Save snapshots and update preview comments
        env:
          GH_TOKEN: ${{ github.token }}
          READY: ${{ steps.prepare.outputs.ready }}
        run: |
          args=()
          if [[ "$READY" == true ]]; then args+=(--ready); fi
          python3 scripts/publish_docs.py finalize --workspace "$RUNNER_TEMP/documentation" "${args[@]}"
      - name: Report publication errors
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_docs.py error --workspace "$RUNNER_TEMP/documentation"
